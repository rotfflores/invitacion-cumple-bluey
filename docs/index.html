<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#dcecff">
  <title>¡Mi cumple! | Invitación</title>
  <meta name="description" content="Una invitación digital para celebrar un cumpleaños muy especial.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#123b80;--blue:#39a9e8;--orange:#f59a3d}*{box-sizing:border-box}html{background:#c8dcf5}body{margin:0;color:var(--navy);font-family:Fredoka,Arial,sans-serif}.page{min-height:100svh;display:grid;place-items:center;padding:24px 12px;background:radial-gradient(circle at 50% 0,#eef7ff,#bed5ef)}.invite{position:relative;width:min(100%,520px);min-height:900px;overflow:hidden;padding:42px 34px 30px;text-align:center;background:linear-gradient(#dcecff,#d7e9ff);border-radius:34px;box-shadow:0 24px 70px #143e752e;isolation:isolate}.invite:before{content:"";position:absolute;inset:13px;border:2px solid #ffffffb3;border-radius:24px;pointer-events:none}.spot{position:absolute;z-index:-1;width:78px;height:78px;border-radius:50%;background:#fff;opacity:.9}.s1{top:-25px;left:-22px}.s2{top:22px;right:-33px;background:var(--blue)}.s3{top:340px;left:-48px;background:var(--blue)}.s4{top:500px;right:-45px}.s5{bottom:90px;left:-38px}.s6{bottom:-31px;right:42px;background:var(--blue)}.eyebrow{margin:0 0 2px;font-size:clamp(15px,4vw,20px);font-weight:700;letter-spacing:.08em}h1{margin:0;color:#42aee8;font-size:clamp(48px,14vw,76px);line-height:.95;letter-spacing:-.05em;text-shadow:0 4px #fff,0 7px #123b8029}.scene{position:relative;height:290px;margin-top:18px}.balloon{position:absolute;top:12px;width:98px;height:124px;border-radius:52% 48% 50%;box-shadow:inset -8px -12px #0000000f;animation:float 4s ease-in-out infinite}.balloon:before{content:"";position:absolute;left:21px;top:18px;width:13px;height:32px;border:5px solid;border-color:#ffffffcc transparent transparent #ffffffcc;border-radius:50%;transform:rotate(8deg)}.balloon:after{content:"";position:absolute;left:43px;bottom:-12px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:15px solid currentColor}.balloon i{position:absolute;top:130px;left:48px;width:2px;height:100px;background:#fff;transform:rotate(5deg)}.orange{background:var(--orange);color:var(--orange)}.blue{background:var(--blue);color:var(--blue)}.left{left:46px;transform:rotate(-9deg)}.center{left:50%;top:0;transform:translateX(-50%);z-index:2}.right{right:46px;transform:rotate(9deg)}.burst{position:absolute;left:50%;bottom:3px;transform:translateX(-50%) rotate(-5deg);font-size:102px;filter:drop-shadow(0 9px #123b801f);animation:pop .7s both}.confetti{position:absolute;width:7px;height:24px;border-radius:8px;background:var(--orange);transform:rotate(25deg)}.c1{left:20px;top:173px}.c2{left:80px;top:215px;background:var(--blue);transform:rotate(-35deg)}.c3{right:25px;top:160px;background:var(--blue);transform:rotate(38deg)}.c4{right:76px;top:225px}.name{margin:2px 0 0;font-size:clamp(52px,15vw,82px);line-height:.95;letter-spacing:-.045em}.age{margin:8px 0 20px;font-size:clamp(23px,6vw,32px)}.details{display:grid;grid-template-columns:1fr 3px 1.45fr;align-items:center;min-height:148px;padding:18px 17px;background:#fffffff0;box-shadow:0 8px 20px #123b801a}.rule{width:3px;height:110px;background:var(--navy)}.date,.event{display:flex;flex-direction:column;align-items:center}.date span{font-size:16px}.date strong{font-family:Georgia,serif;font-size:60px;line-height:.88;font-weight:500}.event strong{font-size:18px}.event span{margin-top:12px;font-size:16px;font-weight:700}.event p{margin:3px 0 0;font-size:14px;line-height:1.15}.rsvp{width:100%;margin-top:18px;padding:15px 22px;border:0;border-radius:999px;color:#fff;background:var(--navy);font:700 18px Fredoka;cursor:pointer;box-shadow:0 8px #0a285d;transition:.2s}.rsvp:hover{transform:translateY(-2px);box-shadow:0 10px #0a285d}.rsvp:focus-visible{outline:4px solid var(--orange);outline-offset:3px}.note{margin:18px 0 0;font-size:14px;font-weight:600}@keyframes float{50%{translate:0 -9px}}@keyframes pop{from{opacity:0;scale:.75}to{opacity:1;scale:1}}@media(max-width:430px){.page{padding:0}.invite{min-height:100svh;border-radius:0;padding:34px 22px 24px}.left{left:18px}.right{right:18px}.details{padding-inline:9px}.event strong{font-size:16px}}@media(prefers-reduced-motion:reduce){.balloon,.burst{animation:none}}
  </style>
</head>
<body>
  <main class="page"><article class="invite" aria-label="Invitación de cumpleaños">
    <i class="spot s1"></i><i class="spot s2"></i><i class="spot s3"></i><i class="spot s4"></i><i class="spot s5"></i><i class="spot s6"></i>
    <header><p class="eyebrow">ESTE EPISODIO ES DE</p><h1>¡MI CUMPLE!</h1></header>
    <div class="scene" aria-hidden="true"><div class="balloon orange left"><i></i></div><div class="balloon blue center"><i></i></div><div class="balloon orange right"><i></i></div><i class="confetti c1"></i><i class="confetti c2"></i><i class="confetti c3"></i><i class="confetti c4"></i><div class="burst">🎉</div></div>
    <h2 class="name">NOMBRE</h2><p class="age">cumple <strong>2</strong> años</p>
    <section class="details" aria-label="Detalles del evento"><div class="date"><span>SÁBADO</span><strong>27</strong><span>AGOSTO</span></div><div class="rule"></div><div class="event"><strong>3:00 PM A 5:00 PM</strong><span>EN CASA</span><p>CALLE Y NÚMERO<br>CIUDAD</p></div></section>
    <button class="rsvp" type="button">Confirmar asistencia →</button><p class="note">¡Te esperamos para jugar y celebrar!</p>
  </article></main>
  <script>document.querySelector('.rsvp').addEventListener('click',()=>open('https://wa.me/?text='+encodeURIComponent('¡Hola! Confirmo mi asistencia al cumpleaños 🎈'),'_blank','noopener,noreferrer'));</script>
</body>
</html>
