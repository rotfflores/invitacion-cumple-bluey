<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c9edff"><title>¡Mi cumple! | Invitación de Mateo</title><meta name="description" content="Acompáñanos a celebrar el cumpleaños de Mateo."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="overrides.css"></head>
<body><main class="invitation-page">
  <section class="hero-section" aria-label="Invitación para Mateo">
    <img class="balloons balloons-left" src="assets/balloons-left.png" alt=""><img class="balloons balloons-right" src="assets/balloons-right.png" alt="">
    <span class="invited" data-curve>¡Estás invitado!</span><img class="characters" src="assets/characters.png" alt="Bluey y Bingo celebrando">
    <figure class="ribbon ribbon-blue"><img src="assets/ribbon.png" alt=""><figcaption class="ribbon-copy ribbon-copy-blue" data-curve>Cumpleaños de</figcaption></figure>
    <h1><small aria-hidden="true">🐾</small> Mateo <small aria-hidden="true">🐾</small></h1>
    <figure class="ribbon ribbon-gold"><img src="assets/celebrate-ribbon.png" alt=""><figcaption class="ribbon-copy ribbon-copy-gold" data-curve>Acompáñanos a celebrar</figcaption></figure>
  </section>
  <section class="details-section" aria-label="Detalles del evento"><p class="date"><span>SÁBADO</span><strong>27</strong><span>AGOSTO</span></p><hr aria-hidden="true"><p class="event"><strong>3:00 PM A 5:00 PM</strong><span>EN CASA</span><small>CALLE Y NÚMERO<br>CIUDAD</small></p></section>
  <section class="rsvp-section"><button type="button">Confirmar asistencia →</button><p>¡Te esperamos para jugar y celebrar!</p></section>
</main><script>document.querySelectorAll('[data-curve]').forEach(el=>{const text=el.textContent||'';const letters=[...text];const middle=(letters.length-1)/2;const dip=el.classList.contains('ribbon-copy-gold');el.textContent='';el.setAttribute('aria-label',text);el.setAttribute('role','text');letters.forEach((letter,index)=>{const n=middle===0?0:(index-middle)/middle;const y=dip?(1-n*n)*7:n*n*7;const span=document.createElement('span');span.textContent=letter===' '?'\u00a0':letter;span.setAttribute('aria-hidden','true');span.style.setProperty('--curve-y',Math.round(y)+'px');el.append(span)})});document.querySelector('.rsvp-section button').addEventListener('click',()=>open('https://wa.me/?text='+encodeURIComponent('¡Hola! Confirmo mi asistencia al cumpleaños de Mateo 🎈'),'_blank','noopener,noreferrer'));</script></body></html>
