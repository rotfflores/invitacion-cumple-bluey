<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07509a"><title>¡Mi cumple! | Invitación de Mateo</title><meta name="description" content="Acompáñanos a celebrar el cumpleaños de Mateo."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=4"><link rel="stylesheet" href="overrides.css?v=4"></head>
<body><main class="invitation-page">
  <section class="hero-section" aria-label="Invitación para Mateo">
    <img class="balloons balloons-left" src="assets/balloons-left.png" alt=""><img class="balloons balloons-right" src="assets/balloons-right.png" alt="">
    <span class="invited" data-curve>¡Estás invitado!</span><img class="characters" src="assets/characters.png" alt="Bluey y Bingo celebrando">
    <figure class="ribbon ribbon-blue"><img src="assets/ribbon.png" alt=""><svg class="ribbon-copy" viewBox="0 0 800 240" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Cumpleaños de"><path id="blue-ribbon-path" d="M 90 142 Q 400 78 710 142" fill="none"/><text><textPath href="#blue-ribbon-path" startOffset="50%" text-anchor="middle">Cumpleaños de</textPath></text></svg></figure>
    <h1><small aria-hidden="true">🐾</small> Mateo <small aria-hidden="true">🐾</small></h1>
    <figure class="ribbon ribbon-gold"><img src="assets/celebrate-ribbon.png" alt=""><svg class="ribbon-copy" viewBox="0 0 800 240" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Acompáñanos a celebrar"><path id="gold-ribbon-path" d="M 82 102 Q 400 160 718 102" fill="none"/><text><textPath href="#gold-ribbon-path" startOffset="50%" text-anchor="middle">Acompáñanos a celebrar</textPath></text></svg></figure>
  </section>
  <section class="details-section" aria-label="Detalles del evento"><p class="date"><span>SÁBADO</span><strong>27</strong><span>AGOSTO</span></p><hr aria-hidden="true"><p class="event"><strong>3:00 PM A 5:00 PM</strong><span>EN CASA</span><small>CALLE Y NÚMERO<br>CIUDAD</small></p></section>
  <section class="rsvp-section"><button type="button">Confirmar asistencia →</button><p>¡Te esperamos para jugar y celebrar!</p></section>
</main><script>document.querySelectorAll('[data-curve]').forEach(el=>{const text=el.textContent||'';const letters=[...text];const middle=(letters.length-1)/2;const invited=el.classList.contains('invited');const gold=el.classList.contains('ribbon-copy-gold');const amplitude=invited?7:(gold?10:12);el.textContent='';el.setAttribute('aria-label',text);el.setAttribute('role','text');letters.forEach((letter,index)=>{const n=middle===0?0:(index-middle)/middle;const y=gold?(1-n*n)*amplitude:n*n*amplitude;const span=document.createElement('span');span.textContent=letter===' '?'\u00a0':letter;span.setAttribute('aria-hidden','true');span.style.setProperty('--curve-y',Math.round(y)+'px');el.append(span)})});document.querySelector('.rsvp-section button').addEventListener('click',()=>open('https://wa.me/?text='+encodeURIComponent('¡Hola! Confirmo mi asistencia al cumpleaños de Mateo 🎈'),'_blank','noopener,noreferrer'));</script></body></html>
